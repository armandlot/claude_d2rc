# Configuration Cloudflare Workers — voir DEPLOY.md.
name = "d2r-run-counter"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# Application (PWA) construite par `npm run build` dans dist/.
# Seules les routes /api/* passent par le Worker ; le reste est servi
# directement comme fichiers statiques (gratuit et illimité).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Base de données D1. Remplacez database_id par l'identifiant affiché par
# `npx wrangler d1 create d2r-run-counter` (voir DEPLOY.md, étape 2).
# En local (`wrangler dev`), une base SQLite locale est utilisée : l'identifiant
# n'a pas besoin d'être réel.
[[d1_databases]]
binding = "DB"
database_name = "d2r-run-counter"
database_id = "7f008dfe-6e06-4e69-9d2a-42482e464954"
migrations_dir = "migrations"

[observability]
enabled = true

# Connexion Google. L'ID client est public ; les secrets GOOGLE_CLIENT_SECRET et
# AUTH_PEPPER se règlent dans Cloudflare (Settings → Variables and Secrets), ou dans
# .dev.vars en local : jamais dans le dépôt.
[vars]
GOOGLE_CLIENT_ID = "1065872748048-6rpjb4hq88bbf3di7dkf99884nlcs0it.apps.googleusercontent.com"
